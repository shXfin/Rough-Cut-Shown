<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Take Finder</title>
<style>
:root{--bg:#121315;--panel:#1b1c1f;--ink:#ecebe7;--muted:#8d8b85;--rule:#2a2b2f;--pick:#3fbf86;--feed:#ff6b5c;--wind:#f0a135;--check:#ff6b5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"SF Pro Text",system-ui,sans-serif}
.top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--rule);padding:14px 20px;display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.top .sum{color:var(--muted)}
.top label{color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
#toast{margin-left:auto;color:var(--pick);font-weight:600;min-height:1em}
.line{border-bottom:1px solid var(--rule);padding:16px 20px 18px}
.line header{display:grid;grid-template-columns:56px 1fr auto;gap:2px 14px;align-items:baseline;margin-bottom:10px}
.line h2{margin:0;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.script{font-size:16px;font-weight:600}
.who{grid-column:2;color:var(--muted);font-size:13px}
.has-check .who{color:var(--check);font-weight:600}
.jump{grid-row:1/3;grid-column:3;background:none;border:1px solid var(--rule);color:var(--ink);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
.jump:hover{border-color:var(--ink)}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.take{flex:0 0 auto;width:300px;text-align:left;background:var(--panel);border:2px solid transparent;border-radius:8px;padding:8px;color:inherit;font:inherit;cursor:pointer}
.take:hover{border-color:#55565c}
.take.is-pick{border-color:var(--pick)}
.take.is-feed{opacity:.45}
.pics{display:flex;gap:4px}
.pics figure{margin:0;position:relative;flex:1;min-width:0}
.pics img{display:block;width:100%;height:84px;object-fit:cover;border-radius:4px;background:#000}
.pics figcaption{position:absolute;left:4px;top:3px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.nopic{height:84px;display:grid;place-items:center;color:var(--muted);background:#0c0c0d;border-radius:4px}
.meta{display:flex;justify-content:space-between;margin-top:6px;font-weight:700}
.tc{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px;min-height:18px;margin-top:2px}
.t{font-size:12px;font-weight:700}
.t.pick{color:var(--pick)} .t.feed{color:var(--feed)} .t.wind{color:var(--wind)} .t.miss{color:var(--muted);font-weight:500}
.take p{margin:4px 0 0;color:var(--muted);font-size:12px}
.only-check .line:not(.has-check){display:none}
</style>
</head>
<body>
<div class="top">
  <h1>Take Finder</h1>
  <span class="sum">{{N}} lines · {{CHECKS}} need your ear · click a take to jump to it in the scrub</span>
  <label><input type="checkbox" id="onlyCheck"> Only lines to check</label>
  <span id="toast"></span>
</div>
<main>
{{ROWS}}
</main>
<script>
const toast = document.getElementById("toast");
let timer;
function say(msg){ toast.textContent = msg; clearTimeout(timer); timer = setTimeout(() => toast.textContent = "", 3500); }
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-seq]"); if (!b) return;
  try {
    const r = await fetch(`/jump?seq=${b.dataset.seq}&t=${b.dataset.t}`, {method: "POST"});
    const txt = await r.text();
    let msg = txt === "ok" ? (b.dataset.seq === "scrub" ? "Premiere: jumped to it in the scrub" : "Premiere: jumped to it in the rough cut") : "Premiere didn't answer (is the Claude Bridge panel open?)";
    if (b.dataset.say) { try { await navigator.clipboard.writeText(b.dataset.say); msg += ` · copied "${b.dataset.say}"`; } catch (_) {} }
    say(msg);
  } catch (_) { say("The take finder server isn't running"); }
});
const only = document.getElementById("onlyCheck");
try { only.checked = localStorage.getItem("onlyCheck") === "1"; } catch (_) {}
const apply = () => { document.body.classList.toggle("only-check", only.checked); try { localStorage.setItem("onlyCheck", only.checked ? "1" : "0"); } catch (_) {} };
only.addEventListener("change", apply); apply();
</script>
</body>
</html>
