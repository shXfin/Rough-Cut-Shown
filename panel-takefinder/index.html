<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Take Finder</title>
<style>
:root{--bg:#1d1d1d;--s1:#242424;--s2:#2b2b2b;--line:#333;--ink:#dedede;--ink2:#a3a3a3;--ink3:#6f6f6f;--blue:#2d8ceb;--pick:#58b883;--bad:#e5675a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;flex-direction:column;color:var(--ink);font:11.5px/1.45 -apple-system,"SF Pro Text",system-ui,sans-serif;user-select:none;-webkit-font-smoothing:antialiased;overflow:hidden}
header{flex:none;padding:10px 12px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font-size:13px;font-weight:700;color:#f2f2f2}
label{display:block;margin-top:6px;color:var(--ink3);font-size:10.5px;font-weight:600}
select{width:100%;height:26px;margin-top:3px;padding:0 6px;background:var(--s1);color:var(--ink);border:1px solid #3b3b3b;border-radius:3px;font:inherit;outline:none}
select:focus{border-color:var(--blue)}
.row{display:flex;gap:4px;margin-top:8px}
button{flex:1;height:26px;padding:0 8px;background:transparent;color:var(--ink2);border:1px solid #3b3b3b;border-radius:3px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
button:hover{color:var(--ink);border-color:#555;background:#262626}
button.main{background:var(--blue);border-color:var(--blue);color:#fff}
button.main:hover{background:#3b97f0}
button.on{color:var(--pick);border-color:var(--pick)}
#status{min-height:15px;margin-top:6px;color:var(--ink3)}
#warn{display:none;margin:10px 12px 0;padding:8px 10px;border-left:2px solid var(--bad);background:var(--s1);color:#f0c4be;font-weight:600}
#scroll{flex:1;min-height:0;overflow-y:auto}
#here{padding:12px}
#here .t{font-size:13px;font-weight:700;color:#f4f4f4}
#here .s{margin-top:3px;color:var(--ink2)}
#list .it{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
#list .it:hover{background:#232323}
#list .it.cur{background:rgba(88,184,131,.11);box-shadow:inset 3px 0 0 var(--pick)}
#list .it b{flex:1;font-weight:600}
#list .it span{color:var(--ink3);font-variant-numeric:tabular-nums}
#hint{padding:24px 16px;color:var(--ink3);text-align:center;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>Take Finder</h1>
  <label>Parent: the full scrub (every take)</label>
  <select id="parent"></select>
  <label>Child: the sequence you're cutting (best-3 scrub or rough cut)</label>
  <select id="child"></select>
  <div class="row">
    <button id="find" class="main">Show all takes</button>
    <button id="back">Back to child</button>
    <button id="follow">Follow</button>
  </div>
  <div id="status"></div>
</header>
<div id="warn"></div>
<div id="scroll">
  <div id="here"><div id="hint">Pick a parent and a child, then select a clip in the child (or park the playhead on it) and press Show all takes.</div></div>
  <div id="list"></div>
</div>
<script>
// Take Finder v15. Works on any project, no per-project data: you choose the parent (full scrub) and the child.
// A clip in the child is matched to the parent by its media file + source time, so it finds the exact spot
// even after trims, moves and ripple edits. Takes of the same line are listed from the parent's label clips.
const CEP = window.__adobe_cep__;
const $ = id => document.getElementById(id);
const ev = src => new Promise(r => { if (!CEP) { r("__nocep"); return; } CEP.evalScript(src, r); setTimeout(() => r("__timeout"), 8000); });
let projKey = "", seqs = [], back = null, following = false, lastSig = "";
function status(m){ $("status").textContent = m; clearTimeout(status.t); status.t = setTimeout(() => $("status").textContent = "", 6000); }
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), x = s - m * 60; return m + ":" + (x < 10 ? "0" : "") + x.toFixed(1); };

// ---------- ExtendScript (runs in Premiere) ----------
const JSX_LIB = `function tf_json(v){ var t=typeof v; if(v===null||v===undefined) return "null"; if(t=="number") return isFinite(v)?String(v):"null"; if(t=="boolean") return v?"true":"false";
  if(t=="string") return '"'+v.replace(/\\\\/g,"\\\\\\\\").replace(/"/g,'\\\\"').replace(/\\n/g,"\\\\n").replace(/\\r/g,"\\\\r").replace(/\\t/g,"\\\\t")+'"';
  if(v instanceof Array){ var a=[]; for(var i=0;i<v.length;i++) a.push(tf_json(v[i])); return "["+a.join(",")+"]"; }
  var o=[]; for(var k in v) if(v.hasOwnProperty(k)) o.push(tf_json(String(k))+":"+tf_json(v[k])); return "{"+o.join(",")+"}"; }

function tf_seq(id){ var p=app.project; for(var i=0;i<p.sequences.numSequences;i++){ if(p.sequences[i].sequenceID==id) return p.sequences[i]; } return null; }
function tf_isLabel(n){ return /\\.(png|jpg|jpeg|psd|tif|tiff)$/i.test(n); }
function tf_media(k){ try{ return k.projectItem ? k.projectItem.getMediaPath() : ""; }catch(e){ return ""; } }
function tf_speed(k){ try{ var s=k.getSpeed(); return s>0?s:1; }catch(e){ return 1; } }
function tf_inSrc(k){ return k.inPoint.seconds*tf_speed(k); }   // Premiere reports in points of speed-changed clips divided by the speed
// clips under time t in a sequence (selected clips win), as [media, srcTime, isVideo, name]
function tf_under(s, t){
  var out=[], sel=null; try{ sel=s.getSelection(); }catch(e){}
  if(sel && sel.length){
    for(var i=0;i<sel.length;i++){ var k=sel[i]; if(!k.projectItem || tf_isLabel(k.name)) continue;
      var tt=(t>=k.start.seconds && t<k.end.seconds)?t:(k.start.seconds+k.end.seconds)/2;
      out.push([tf_media(k), tf_inSrc(k)+(tt-k.start.seconds)*tf_speed(k), k.mediaType=="Video", k.name]); }
    if(out.length) return out;
  }
  var groups=[s.videoTracks,s.audioTracks];
  for(var g=0;g<2;g++) for(var i=groups[g].numTracks-1;i>=0;i--){ var tr=groups[g][i];
    for(var c=0;c<tr.clips.numItems;c++){ var k=tr.clips[c];
      if(k.start.seconds<=t+0.001 && k.end.seconds>t+0.001 && k.projectItem && !tf_isLabel(k.name))
        out.push([tf_media(k), tf_inSrc(k)+(t-k.start.seconds)*tf_speed(k), g==0, k.name]); } }
  return out;
}
// where the child's clip lives in the parent: same media file, source time inside the parent clip (else nearest)
function tf_match(pid, cid){
  var P=tf_seq(pid), C=tf_seq(cid); if(!P||!C) return tf_json({err:"Pick both sequences."});
  var act=app.project.activeSequence, t;
  if(act && act.sequenceID==cid) t=C.getPlayerPosition().seconds;
  else if(act && act.sequenceID==pid) return tf_json({err:"You're in the parent. Open the child to look a clip up."});
  else t=C.getPlayerPosition().seconds;
  var under=tf_under(C,t); if(!under.length) return tf_json({err:"No clip under the playhead in the child."});
  var best=null, groups=[P.videoTracks,P.audioTracks];
  for(var u=0;u<under.length;u++){ var med=under[u][0], src=under[u][1]; if(!med) continue;
    for(var g=0;g<2;g++) for(var i=0;i<groups[g].numTracks;i++){ var tr=groups[g][i];
      for(var c=0;c<tr.clips.numItems;c++){ var k=tr.clips[c]; if(tf_media(k)!=med) continue;
        var sp=tf_speed(k), a=tf_inSrc(k), b=a+(k.end.seconds-k.start.seconds)*sp;
        var d = src<a ? a-src : (src>b ? src-b : 0);
        var pt = k.start.seconds + (Math.min(Math.max(src,a),b)-a)/sp;
        var score = d + (under[u][2]?0:0.001) + (g==0?0:0.0005);
        if(!best || score<best.score) best={score:score, dist:d, at:pt, name:k.name, child:under[u][3], src:src}; } } }
  if(!best) return tf_json({err:"That clip's media isn't in the parent."});
  // label clips around that spot (line/take labels on a top track), to list the line's takes
  var labels=[];
  for(var i=0;i<P.videoTracks.numTracks;i++){ var tr=P.videoTracks[i];
    for(var c=0;c<tr.clips.numItems;c++){ var k=tr.clips[c]; if(tf_isLabel(k.name)) labels.push([k.name.replace(/\\.[^.]+$/,""), k.start.seconds, k.end.seconds]); } }
  labels.sort(function(x,y){return x[1]-y[1];});
  var here=null; for(var i=0;i<labels.length;i++){ if(labels[i][1]<=best.at+0.01 && labels[i][2]>best.at+0.01){ here=labels[i]; break; } }
  if(!here){ for(var i=0;i<labels.length;i++){ if(labels[i][1]<=best.at+0.5 && best.at-labels[i][2]<1.5) here=labels[i]; } }   // trimmed clip sitting just past its label
  var key = here ? here[0].split("_")[0] : null, takes=[];
  if(key){ for(var i=0;i<labels.length;i++) if(labels[i][0].split("_")[0]==key) takes.push(labels[i]); }
  else { for(var i=0;i<labels.length;i++) if(Math.abs(labels[i][1]-best.at)<45) takes.push(labels[i]); }
  return tf_json({at:best.at, dist:best.dist, name:best.name, child:best.child, t:t, line:key, label:here?here[0]:null, takes:takes});
}
function tf_go(id, sec){ var s=tf_seq(id); if(!s) return "no seq"; app.project.openSequence(id); var tk=Math.round(sec*254016000000); s.setPlayerPosition(String(tk)); return "ok"; }
function tf_list(){ var p=app.project, o=[]; for(var i=0;i<p.sequences.numSequences;i++) o.push({id:p.sequences[i].sequenceID, name:p.sequences[i].name});
  return tf_json({proj:p.path, seqs:o, active:p.activeSequence?p.activeSequence.sequenceID:""}); }
function tf_pos(){ var a=app.project.activeSequence; return a? tf_json({id:a.sequenceID, t:a.getPlayerPosition().seconds}) : "{}"; }
`;
let libLoaded = false;
async function jsx(call){ if (!libLoaded) { await ev(JSX_LIB); libLoaded = true; } let r = await ev(call); if (r === "EvalScript error.") { await ev(JSX_LIB); r = await ev(call); } return r; }

function saveChoice(){ try { localStorage.setItem("tf15:" + projKey, JSON.stringify({p: $("parent").value, c: $("child").value})); } catch (e) {} }
async function loadSeqs(){
  const raw = await jsx("tf_list()"); let d; try { d = JSON.parse(raw); } catch (e) { $("warn").style.display = "block"; $("warn").textContent = "Can't reach Premiere."; return; }
  projKey = d.proj; seqs = d.seqs;
  const keep = {p: $("parent").value, c: $("child").value};
  let saved = {}; try { saved = JSON.parse(localStorage.getItem("tf15:" + projKey) || "{}"); } catch (e) {}
  for (const id of ["parent", "child"]) {
    const sel = $(id); sel.innerHTML = '<option value="">Choose a sequence</option>' + seqs.map(s => `<option value="${s.id}">${s.name.replace(/</g, "&lt;")}</option>`).join("");
    const want = keep[id[0]] || saved[id[0]]; if (want && seqs.some(s => s.id === want)) sel.value = want;
  }
  const few = seqs.length < 2;
  $("warn").style.display = few ? "block" : "none";
  $("warn").textContent = few ? "Take Finder needs at least two sequences: the full scrub (parent) and the cut you're working on (child)." : "";
}
function drawResult(r){
  if (r.err) { $("here").innerHTML = `<div id="hint">${r.err}</div>`; $("list").innerHTML = ""; return; }
  const near = r.dist > 0.05 ? ` (nearest, ${r.dist.toFixed(1)} s off)` : "";
  $("here").innerHTML = `<div class="t">${r.label ? r.label.replace(/_/g, "  ") : r.name}</div><div class="s">In the parent at ${fmt(r.at)}${near}. Child clip: ${r.child}</div>`;
  $("list").innerHTML = (r.takes || []).map(x => `<div class="it ${r.label === x[0] ? "cur" : ""}" data-at="${x[1]}"><b>${x[0].replace(/_/g, "  ")}</b><span>${fmt(x[1])}</span></div>`).join("");
  document.querySelectorAll("#list .it").forEach(el => el.onclick = () => goParent(+el.dataset.at));
}
async function lookup(){
  const p = $("parent").value, c = $("child").value;
  if (!p || !c) { status("Pick a parent and a child first."); return null; }
  if (p === c) { status("Parent and child must be different sequences."); return null; }
  const raw = await jsx(`tf_match(${JSON.stringify(p)},${JSON.stringify(c)})`);
  let r; try { r = JSON.parse(raw); } catch (e) { status("Premiere didn't answer."); return null; }
  drawResult(r); return r;
}
async function goParent(at){
  const pos = JSON.parse(await jsx("tf_pos()") || "{}");
  if (pos.id === $("child").value) back = pos;
  await jsx(`tf_go(${JSON.stringify($("parent").value)},${at})`); status("In the parent at " + fmt(at));
}
$("find").onclick = async () => { const r = await lookup(); if (r && !r.err) goParent(r.at); };
$("back").onclick = async () => { const c = $("child").value; if (!c) return; await jsx(`tf_go(${JSON.stringify(c)},${back && back.id === c ? back.t : 0})`); status("Back in the child."); };
$("follow").onclick = () => { following = !following; $("follow").classList.toggle("on", following); status(following ? "Following the child's playhead." : "Follow off."); };
$("parent").onchange = $("child").onchange = saveChoice;
async function poll(){
  if (following) {
    const pos = JSON.parse(await jsx("tf_pos()") || "{}");
    const sig = pos.id + ":" + (pos.t || 0).toFixed(1);
    if (pos.id === $("child").value && sig !== lastSig) { lastSig = sig; await lookup(); }
  }
  setTimeout(poll, 700);
}
loadSeqs(); setInterval(loadSeqs, 15000); poll();
</script>
</body>
</html>
